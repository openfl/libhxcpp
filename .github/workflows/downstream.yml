name: downstream
# Builds the main users of hxcpp against this checkout every night, and when
# started by hand, so a change that breaks them shows up before a release.
# CrossByte's native and stress suites run on Linux. Lime and OpenFL samples and
# the small Flixel, Feathers UI and HaxeUI apps in test/downstream are built on
# Linux and Windows, not run.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
  # Pushing a downstream/ branch runs it on that branch
  push:
    branches: ['downstream/**']

permissions:
  contents: read

env:
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp-cache
  HXCPP_NONINTERACTIVE: 1

jobs:
  crossbyte:
    name: CrossByte suites
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup
        uses: ./.github/workflows/setup
        with:
          haxe: 4.3.7

      - name: checkout CrossByte
        uses: actions/checkout@v7
        with:
          repository: DimensionscapeOrg/crossbyte
          path: crossbyte

      # CrossByte's tests type-check against utest 1.13.2
      - name: libraries
        shell: bash
        run: |
          bash test/downstream/haxelib-install.sh emitter 2.0.0
          bash test/downstream/haxelib-install.sh utest 1.13.2
          haxelib set utest 1.13.2 --always
          haxelib dev crossbyte "$PWD/crossbyte"

      # Run from CrossByte's root: some tests look for src/ above the working directory
      - name: native suite
        shell: bash
        working-directory: crossbyte
        run: |
          haxe -cp src -lib emitter -cp tests -lib utest -D HXCPP_M64 -main NativeSmokeMain --cpp ../cb/native \
            --macro "crossbyte._internal.macro.HostPlatform.define()" --macro "crossbyte.test.SuiteCoverage.check()"
          timeout 1200 ../cb/native/NativeSmokeMain

      - name: stress suite
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: crossbyte
        run: |
          haxe -cp src -lib emitter -cp tests -D HXCPP_M64 -main StressMain --cpp ../cb/stress
          timeout 1200 ../cb/stress/StressMain

  apps:
    name: Lime, OpenFL, Flixel, Feathers UI and HaxeUI on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup
        uses: ./.github/workflows/setup
        with:
          haxe: 4.3.7

      - name: libraries
        shell: bash
        run: |
          for lib in lime openfl lime-samples openfl-samples actuate flixel feathersui haxeui-core haxeui-openfl; do
            bash test/downstream/haxelib-install.sh $lib || exit 1
          done
          haxelib list

      - name: build
        shell: bash
        run: |
          target=${{ runner.os == 'Windows' && 'windows' || 'linux' }}
          lime=$(haxelib libpath lime-samples)
          openfl=$(haxelib libpath openfl-samples)
          failed=""
          build() {
            echo "::group::$1"
            if ! (cd "$2" && haxelib run lime build $target -release -nocolor); then
              failed="$failed $1"
              echo "::error::$1 did not build"
            fi
            echo "::endgroup::"
          }
          build lime-HelloWorld "$lime/demos/HelloWorld"
          build lime-TextRendering "$lime/features/text/TextRendering"
          build openfl-DisplayingABitmap "$openfl/features/display/DisplayingABitmap"
          build openfl-PiratePig "$openfl/demos/PiratePig"
          build openfl-HerokuShaders "$openfl/demos/HerokuShaders"
          build openfl-Stage3DCamera "$openfl/features/display3D/Stage3DCamera"
          build openfl-AddingText "$openfl/features/text/AddingText"
          build flixel test/downstream/flixel
          build feathersui test/downstream/feathersui
          build haxeui test/downstream/haxeui
          [ -z "$failed" ] || { echo "Did not build:$failed"; exit 1; }
