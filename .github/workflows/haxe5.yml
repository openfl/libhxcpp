name: haxe 5 preview
# Not on pull requests: its failures are only warnings, and main runs it once
# a change lands
on:
  push:
    branches: [main, 'release/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE.txt'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes the run in progress,
# except on main and release branches
concurrency:
  # Each push to main or a release branch is its own group, so every commit
  # there gets a complete result; elsewhere the newest push wins
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && github.sha) || github.ref }}
  cancel-in-progress: true

# Haxe 5 is not released, so its failures are warnings: with warn_only, a
# failing step leaves its job green, and the warnings job below lists the
# jobs that had one. Each failure still gets an issue, but it holds back
# neither a merge nor a release (CONTRIBUTING.md).
jobs:
  # Haxe 5.0.0-preview.1 passes API level 500 but generates code for the level
  # 430 runtime, and the build tool builds it against that runtime
  # (BuildTool.haxeRuntimeLevels). Every suite runs with it on Linux, and the
  # core suites on Windows and macOS arm64.
  haxe5-preview-linux:
    name: Haxe 5.0.0-preview.1 / Linux 64
    uses: ./.github/workflows/test.yml
    with:
      haxe: 5.0.0-preview.1
      warn_only: true
      arch: 64
      sep: /
      ext: .dso
      os: ubuntu-latest
      stress: '["default generational-verify"]'
      bindir: Linux64

  haxe5-preview-windows:
    name: Haxe 5.0.0-preview.1 / Windows 64
    uses: ./.github/workflows/test.yml
    with:
      haxe: 5.0.0-preview.1
      warn_only: true
      arch: 64
      sep: \
      ext: .dll
      os: windows-latest
      scope: smoke

  haxe5-preview-macos:
    name: Haxe 5.0.0-preview.1 / macOS arm64
    uses: ./.github/workflows/test.yml
    with:
      haxe: 5.0.0-preview.1
      warn_only: true
      arch: Arm64
      sep: /
      ext: .dylib
      os: macos-latest
      scope: smoke
      bindir: MacArm64

  # A step that fails with continue-on-error has the conclusion "success" in the
  # jobs API, so the failures are read from each job's error annotations,
  # where "Process completed with exit code" marks one failed step
  warnings:
    name: Haxe 5.0.0-preview.1 / warnings
    needs: [haxe5-preview-linux, haxe5-preview-windows, haxe5-preview-macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
    steps:
      - name: list the jobs with failed steps
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          jobs="repos/$REPO/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs"
          gh api --paginate "$jobs" --jq '.jobs[] | select(.name | endswith("/ warnings") | not) | "\(.id)\t\(.name)"' > jobs.txt
          : > failed.txt
          while IFS=$'\t' read -r id name; do
            gh api "repos/$REPO/check-runs/$id/annotations" \
              --jq '.[] | select(.annotation_level == "failure") | .message | gsub("\n"; " ")' > errors.txt || continue
            [ -s errors.txt ] || continue
            steps=$(grep -c '^Process completed with exit code' errors.txt || true)
            [ "$steps" = 0 ] || echo "$name: $steps step(s) failed" >> failed.txt
            { grep -v '^Process completed with exit code' errors.txt || true; } | sed "s|^|$name: |" >> failed.txt
          done < jobs.txt
          if [ -s failed.txt ]; then
            { echo "### Haxe 5.0.0-preview.1 failures (warnings)"; sed 's/^/- /' failed.txt; } >> "$GITHUB_STEP_SUMMARY"
            while read -r line; do echo "::warning title=Haxe 5.0.0-preview.1::$line"; done < failed.txt
          else
            echo "No Haxe 5.0.0-preview.1 step failed." >> "$GITHUB_STEP_SUMMARY"
          fi
