name: setup
inputs:
  haxe:
    required: true
    type: string
runs:
  using: composite
  steps:
    - name: install haxe
      if: runner.os != 'Windows' || runner.arch != 'ARM64'
      uses: krdlab/setup-haxe@v2
      with:
        haxe-version: ${{ inputs.haxe }}

    # setup-haxe's releases, v2.1.1 the latest, have no Windows arm64 support.
    # The commit that added it, merged on 2026-10-18, installs the x64 Haxe
    # and Neko there, which Windows runs emulated; use a release once one has it
    - name: install haxe (Windows arm64)
      if: runner.os == 'Windows' && runner.arch == 'ARM64'
      uses: krdlab/setup-haxe@2158bbdec718708920c54ab91fb19d8ddfa28f32
      with:
        haxe-version: ${{ inputs.haxe }}

    - name: install haxe libraries
      shell: pwsh
      run: |
        # git utest's macros do not build with Haxe 5.0.0-preview.1; its haxelib release does
        if ("${{ inputs.haxe }}".StartsWith("5.0.0-preview")) {
          haxelib install utest --always
        } else {
          haxelib git utest https://github.com/haxe-utest/utest
        }
        haxelib git hx4compat https://github.com/HaxeFoundation/hx4compat
        haxelib dev libhxcpp ${{ github.workspace }}
        haxelib run libhxcpp setup
        haxelib list

    # The 32-bit Linux build's libraries, which arm64 runners do not have
    - name: install native libraries
      if: runner.os == 'Linux' && runner.arch == 'X64'
      shell: pwsh
      run: |
        sudo apt-get update -qqy
        sudo apt-get install -qqy gcc-multilib g++-multilib

    - name: build run.n
      working-directory: tools/run
      shell: pwsh
      run: haxe compile.hxml

    - name: build hxcpp
      working-directory: tools/hxcpp
      shell: pwsh
      run: haxe compile.hxml
