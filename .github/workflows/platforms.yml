name: platforms
# The test suites on every platform, for one version of Haxe. main runs them
# with the stable Haxe on every change, and nightly with the Haxe nightly build.
on:
  workflow_call:
    inputs:
      haxe:
        required: true
        type: string
      # macOS Intel runners are the scarcest: every change runs the core suites
      # there, and the nightly run passes full for everything
      intel_scope:
        required: false
        type: string
        default: smoke
      # A pull request: the core suites on Linux 64, Windows 64 and macOS arm64
      # only. main runs everything once the change lands
      pr:
        required: false
        type: boolean
        default: false

jobs:
  Windows32:
    if: ${{ !inputs.pr }}
    uses: ./.github/workflows/test.yml
    name: Windows 32
    with:
      haxe: ${{ inputs.haxe }}
      arch: 32
      sep: \
      ext: .dll
      os: windows-latest

  Windows64:
    uses: ./.github/workflows/test.yml
    name: Windows 64
    with:
      haxe: ${{ inputs.haxe }}
      arch: 64
      sep: \
      ext: .dll
      os: windows-latest
      scope: ${{ inputs.pr && 'smoke' || 'full' }}
      stress: '["default generational verify", "generational-verify moving big-blocks", "always-move check-pointer", "big-generational big-verify nursery dynamic-size debug-level"]'

  MacOS64:
    if: ${{ !inputs.pr }}
    uses: ./.github/workflows/test.yml
    name: macOS Intel
    with:
      haxe: ${{ inputs.haxe }}
      arch: 64
      sep: /
      ext: .dylib
      os: macos-15-intel
      scope: ${{ inputs.intel_scope }}
      bindir: Mac64

  MacOSArm:
    uses: ./.github/workflows/test.yml
    name: macOS arm64
    with:
      haxe: ${{ inputs.haxe }}
      arch: Arm64
      sep: /
      ext: .dylib
      os: macos-latest
      scope: ${{ inputs.pr && 'smoke' || 'full' }}
      bindir: MacArm64

  Linux32:
    if: ${{ !inputs.pr }}
    uses: ./.github/workflows/test.yml
    name: Linux 32
    with:
      haxe: ${{ inputs.haxe }}
      arch: 32
      sep: /
      ext: .dso
      os: ubuntu-latest

  Linux64:
    uses: ./.github/workflows/test.yml
    name: Linux 64
    with:
      haxe: ${{ inputs.haxe }}
      arch: 64
      sep: /
      ext: .dso
      os: ubuntu-latest
      scope: ${{ inputs.pr && 'smoke' || 'full' }}
      stress: '["default generational verify", "generational-verify moving big-blocks", "always-move check-pointer", "big-generational big-verify nursery dynamic-size debug-level"]'
      bindir: Linux64

  # Haxe 4.3.7 has no Linux arm64 build, so this runs with the nightly
  LinuxArm64:
    if: inputs.haxe != '4.3.7' && !inputs.pr
    uses: ./.github/workflows/test.yml
    name: Linux arm64
    with:
      haxe: ${{ inputs.haxe }}
      arch: Arm64
      sep: /
      ext: .dso
      os: ubuntu-24.04-arm
      bindir: LinuxArm64
